name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/gpdl49/simplycorrelate

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/aube-action@c0d7e61d732be4362538a371e6d9a910d2cb5be8 # v1
        with:
          node-version: "24"
      - run: aube ci
      - run: aube run --no-install typecheck
      - run: aube run --no-install lint
      - run: aube run --no-install test
      - run: aube run --no-install build

  image:
    if: github.repository == 'gpdl49/simplycorrelate' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: ghcr-publish
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
      digest: ${{ steps.build.outputs.digest }}
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: vars.CENTERPOINT_ZOT_SIMPLYCORRELATE != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ vars.CENTERPOINT_ZOT_SIMPLYCORRELATE != 'true' }}
          outputs: ${{ vars.CENTERPOINT_ZOT_SIMPLYCORRELATE == 'true' && format('type=oci,oci-mediatypes=true,dest={0}/quiz.oci.tar', runner.temp) || '' }}
          tags: |
            ${{ env.GHCR_IMAGE }}:main
            ${{ env.GHCR_IMAGE }}:main-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify exported OCI index
        if: vars.CENTERPOINT_ZOT_SIMPLYCORRELATE == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          tar -xOf "$RUNNER_TEMP/quiz.oci.tar" "blobs/sha256/${IMAGE_DIGEST#sha256:}" |
            jq -e '.mediaType == "application/vnd.oci.image.index.v1+json" and
              ([.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"])'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.CENTERPOINT_ZOT_SIMPLYCORRELATE == 'true'
        id: archive
        with:
          name: quiz-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quiz.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  zot:
    if: github.repository == 'gpdl49/simplycorrelate' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CENTERPOINT_ZOT_SIMPLYCORRELATE == 'true' && needs.image.outputs.artifact-id != ''
    needs: image
    runs-on:
      group: simplycorrelate-publish
      labels: homestacks-centerpoint
    timeout-minutes: 10
    environment: zot-publish
    container:
      image: quay.io/buildah/stable:v1.43.5@sha256:a6f96bfffc47f36462985573d85e87f782bf2d8b37e02cb3dd307713bfa6cc13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.3.6
      - name: Publish to Zot
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SHORT_SHA: ${{ needs.image.outputs.short-sha }}
          REGISTRY_CA_PEM: ${{ vars.ZOT_CENTERPOINT_CA }}
          REGISTRY_USER: simplycorrelate-publisher
          REGISTRY_PASSWORD: ${{ secrets.ZOT_SIMPLYCORRELATE_PASSWORD }}
        run: |
          : "${REGISTRY_CA_PEM:?Set the Centerpoint Zot CA certificate}"
          tag="$(date -u +%Y%m%d%H%M%S)-$SHORT_SHA"
          bash .github/scripts/publish-oci.sh "zot-centerpoint.vidur.xyz/gpdl49/simplycorrelate:$tag"

  ghcr:
    # A failed Zot publish fails the run, but GHCR still receives the build.
    if: ${{ !cancelled() && github.repository == 'gpdl49/simplycorrelate' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.result == 'success' && needs.image.outputs.artifact-id != '' }}
    needs: [image, zot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.3.6
      - name: Publish to GHCR
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SHORT_SHA: ${{ needs.image.outputs.short-sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-oci.sh "$GHCR_IMAGE:main-$SHORT_SHA" "$GHCR_IMAGE:main"
